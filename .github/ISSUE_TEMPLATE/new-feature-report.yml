name: "Implementation task"
description: "Deliver one focused SQL, Excel/output, app, or access change."
body:
  - type: markdown
    attributes:
      value: "Every field is optional. Create a placeholder with what you know and fill it out later. Mark unknowns explicitly. Use made-up examples and sanitized screenshots; omit student records, credentials, and other sensitive information."

  - type: dropdown
    id: category
    attributes:
      label: "Task category"
      options:
        - "SQL / data extraction"
        - "Excel / report / file output"
        - "App feature / interface"
        - "User roles / access"
        - "Workflow integration"
        - "Other / not sure yet"
    validations:
      required: false

  - type: textarea
    id: outcome
    attributes:
      label: "Outcome and intended users"
      placeholder: |
        One deliverable:
        Who will use it and for what task?
    validations:
      required: false

  - type: textarea
    id: parent
    attributes:
      label: "Parent and dependencies"
      placeholder: |
        Parent issue URL or number:
        Related work:
        Decisions or evidence needed before implementation:
    validations:
      required: false

  - type: textarea
    id: behavior
    attributes:
      label: "Current and desired behavior"
      placeholder: |
        Current behavior or limitation:
        Desired result:
        Confirmed rules and references:
        Behavior to preserve:
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: "Task details"
      placeholder: |
        Fill only the relevant details.
        SQL: sources, population, joins, parameters, date boundaries, duplicates/missing data.
        Excel/output: sheet, one-row meaning, columns/order, formats, sorting, totals, filename/destination.
        App: inputs, actions, messages, availability, and TEST/PROD behavior.
        Roles/access: role, resource, allowed/denied actions, environment, and confirmation needed.
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: "Examples and expected results"
      placeholder: |
        Synthetic before/after example:
        Boundary or exception case:
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance checks"
      description: "Completion reminders, not submission requirements. Edit or remove as needed."
      value: |
        - [ ] Expected behavior is agreed.
        - [ ] Relevant examples and checks pass; limitations are recorded.
        - [ ] Documentation and any required staff SOP updates are complete.
        - [ ] Result is reviewed before closure.
    validations:
      required: false

  - type: textarea
    id: unknowns
    attributes:
      label: "Open questions and next evidence"
      placeholder: |
        Unknowns:
        Evidence still needed:
        Who can supply or confirm it?
    validations:
      required: false
