name: Workflow change
description: Describe a workflow fix or improvement with clear expected results and examples.
body:
  - type: markdown
    attributes:
      value: |
        Use this optional form for a workflow fix or improvement. Every field is
        optional, and you can also choose a blank issue. Fill in what you know;
        list unresolved business decisions under Open questions.

        Use synthetic examples and sanitized screenshots rather than student
        records, financial records, credentials, or session information.

  - type: input
    id: workflow-version
    attributes:
      label: Workflow and application version
      description: Name the affected workflow and the version where you observed the behavior.
      placeholder: "1305 Graduate Contract Recon; version shown in the app"
    validations:
      required: false

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What operational result should this change achieve?
      placeholder: Describe the outcome and why it matters.
    validations:
      required: false

  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: Describe what happens now and the steps or inputs that produce it.
      placeholder: Name the affected output, worksheet, columns, and observed result.
    validations:
      required: false

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Specify exact sheet and column names, grouping, formulas, sign conventions, and filtering rules where applicable.
      placeholder: |
        Output or worksheet:
        Columns to add, remove, rename, or reorder:
        Grouping or matching keys:
        Formula and sign convention:
        Rows to include or exclude (distinguish excluding a row from blanking a cell):
        Exceptions and missing-data behavior:
    validations:
      required: false

  - type: textarea
    id: synthetic-examples
    attributes:
      label: Synthetic examples
      description: Give inputs and exact expected outputs. Include an exception, reversal, or missing-data case when relevant.
      placeholder: |
        Example for CWID Net Period Activity only:
        Same synthetic student, fiscal year, and period:
        signed Banner +6,334.62 and signed non-SIS Workday -6,334.62 -> 0.00.
        signed Banner +6,334.62 and signed non-SIS Workday -6,300.00 -> +34.62.

        Replace these examples with cases for this change.
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope and behavior to preserve
      description: Identify what should change and which existing rules, outputs, or safeguards should remain.
      placeholder: |
        Change:
        Preserve:
        Outside this issue:
    validations:
      required: false

  - type: textarea
    id: open-questions
    attributes:
      label: Open questions and references
      description: List decisions needing owner confirmation and link relevant issues, PRs, or workflow documentation. Distinguish confirmed rules from proposals.
      placeholder: |
        Confirmed rules and references:
        Questions to resolve before implementing the affected behavior:
    validations:
      required: false

  - type: textarea
    id: acceptance-checks
    attributes:
      label: Acceptance checks
      description: These track completion after the issue is created; they are not prerequisites for submitting it. Edit or remove them as needed.
      value: |
        - [ ] Expected behavior and open business decisions are confirmed.
        - [ ] Synthetic examples produce the expected results.
        - [ ] Relevant tests and checks pass; unverified behavior is identified.
        - [ ] Workflow documentation reflects any changed business rules.
        - [ ] Owner reviews the generated output or affected behavior before closure.
    validations:
      required: false
