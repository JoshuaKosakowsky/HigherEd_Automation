name: "Bug / correction"
description: "Describe an observed problem and the expected correction."
body:
  - type: markdown
    attributes:
      value: "Every field is optional. Create a placeholder with what you know and fill it out later. Mark unknowns explicitly. Use made-up examples and sanitized screenshots; omit student records, credentials, and other sensitive information."

  - type: textarea
    id: area
    attributes:
      label: "Affected area and version"
      placeholder: |
        Workflow or component:
        App version, environment, or input type if known:
    validations:
      required: false

  - type: textarea
    id: parent
    attributes:
      label: "Parent and related work"
      placeholder: |
        Parent issue URL or number, if applicable:
        Related issues or documentation:
    validations:
      required: false

  - type: textarea
    id: observed
    attributes:
      label: "Observed behavior"
      placeholder: |
        What happens today?
        Error text or sanitized screenshot if useful:
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      placeholder: |
        Expected result:
        Confirmed business rule or reference:
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: "Steps or example"
      placeholder: |
        Steps to reproduce, or synthetic input:
        Current result:
        Expected result:
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: "Scope and unresolved questions"
      placeholder: |
        What should remain unchanged?
        Unknowns and evidence still needed:
        Who can supply or confirm it?
    validations:
      required: false

  - type: textarea
    id: verification
    attributes:
      label: "Verification and acceptance"
      value: |
        - [ ] The reported problem is reproduced or supported by evidence.
        - [ ] The correction produces the expected result.
        - [ ] Relevant regression checks pass; limitations are recorded.
        - [ ] Documentation is updated where needed.
        - [ ] Result is reviewed before closure.
    validations:
      required: false
